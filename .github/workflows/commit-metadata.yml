name: commit-metadata

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read

concurrency:
  group: commit-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch pull request commit objects
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"

      - name: Validate final commit metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: bash .github/scripts/validate-pr-commit.sh
