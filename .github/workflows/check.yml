name: check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages, typecheck workspaces, and run tests
        run: npm run check

      - name: Build applications
        run: npm run build:apps

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify critical Webview interactions
        run: npm run test:e2e

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            apps/agent-webview/playwright-report/
            apps/agent-webview/test-results/
          if-no-files-found: ignore
          retention-days: 7
