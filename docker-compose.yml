services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ui_forge
      POSTGRES_USER: ui_forge
      POSTGRES_PASSWORD: ui_forge
    ports:
      - "5432:5432"
    volumes:
      - ui-forge-postgres:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ui_forge -d ui_forge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ui-forge-postgres:
